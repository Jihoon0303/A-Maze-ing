name = "mazegen"
version = "1.0.0"
authors = [
  {name="jihchoi"},
  {name="nfalkens"}
]
description = "Maze generation and solving package"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mazegen*"]